name: mispisit-akhmetzhanov

services:
  app:
    image: sideseer/mispisit-lab1:0.0.6
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    image: postgres:18
    profiles: ["tools"]
    environment:
      PGPASSWORD: app
    volumes:
      - ./backup:/backup
    command: pg_dump -h db -U app -d app --clean --if-exists -f /backup/app.sql
    depends_on:
      db:
        condition: service_healthy

  restore:
    image: postgres:18
    profiles: ["tools"]
    environment:
      PGPASSWORD: app
    volumes:
      - ./backup:/backup
    command: psql -h db -U app -d app -f /backup/app.sql
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
